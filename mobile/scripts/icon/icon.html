<!doctype html>
<!--
  Lowkei's mark, rendered by scripts/icon/render.js at every size the app and
  site need. A glassy orb — the Mirror's eye, softened into light — floating
  in an airbrushed aura, with one four-point sparkle catching it.

  ?layer=full        the whole icon on its aura (iOS, Play listing, site)
  ?layer=background  the aura alone (Android adaptive background)
  ?layer=foreground  the orb and sparkle on transparent (Android adaptive foreground, splash)
  ?layer=mono        a white silhouette (Android monochrome, notifications)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; }
  .aura {
    position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(60% 55% at 22% 18%, #8FA2FF 0%, rgba(143,162,255,0) 70%),
      radial-gradient(55% 50% at 85% 30%, #FF9EC8 0%, rgba(255,158,200,0) 72%),
      radial-gradient(70% 60% at 70% 92%, #FFC08A 0%, rgba(255,192,138,0) 70%),
      radial-gradient(60% 55% at 12% 88%, #9EEBD6 0%, rgba(158,235,214,0) 70%),
      linear-gradient(160deg, #C9CFFF 0%, #F6DAF0 55%, #FFE6D3 100%);
  }
  .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: soft-light; }
  .orb {
    position: absolute; left: 50%; top: 50%; width: 440px; height: 440px; margin: -220px 0 0 -220px; border-radius: 50%;
    background:
      radial-gradient(38% 34% at 36% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%),
      radial-gradient(60% 60% at 62% 70%, #FF8FC8 0%, rgba(255,143,200,0) 75%),
      radial-gradient(70% 70% at 30% 75%, #7F8BFF 0%, rgba(127,139,255,0) 80%),
      radial-gradient(circle at 50% 50%, #B7A6FF 0%, #8B7CFF 60%, #6C63E8 100%);
    box-shadow:
      0 0 80px 30px rgba(255,255,255,0.55),
      0 0 160px 60px rgba(201,182,255,0.55),
      inset -30px -40px 80px rgba(70,50,170,0.35),
      inset 20px 24px 60px rgba(255,255,255,0.55);
  }
  .iris {
    position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: radial-gradient(circle at 45% 45%, #FFF3D6 0%, #FFC08A 35%, #FF7FB5 70%, rgba(255,127,181,0) 100%);
    filter: blur(2px);
  }
  .shine { position: absolute; left: 50%; top: 50%; width: 120px; height: 70px; margin: -170px 0 0 -130px; border-radius: 50%; background: rgba(255,255,255,0.85); filter: blur(14px); transform: rotate(-28deg); }
  .spark { position: absolute; left: 672px; top: 188px; width: 170px; height: 170px; filter: drop-shadow(0 0 22px rgba(255,255,255,0.95)) drop-shadow(0 0 40px rgba(255,214,240,0.8)); }
  .spark.small { left: 238px; top: 700px; width: 84px; height: 84px; }
  .mono .orb, .mono .iris, .mono .shine { background: #fff; box-shadow: none; }
  .mono .iris, .mono .shine { display: none; }
  .mono .spark { filter: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="aura" id="aura">
    <svg class="grain" width="1024" height="1024">
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <rect width="1024" height="1024" filter="url(#n)"/>
    </svg>
  </div>
  <div class="orb" id="orb"></div>
  <div class="iris" id="iris"></div>
  <div class="shine" id="shine"></div>
  <svg class="spark" id="spark" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#FFFFFF"/></svg>
  <svg class="spark small" id="spark2" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#FFFFFF"/></svg>
</div>
<script>
  const layer = new URLSearchParams(location.search).get('layer') || 'full';
  const hide = ids => ids.forEach(id => (document.getElementById(id).style.display = 'none'));
  if (layer === 'background') hide(['orb', 'iris', 'shine', 'spark', 'spark2']);
  if (layer === 'foreground') hide(['aura']);
  if (layer === 'mono') { hide(['aura', 'spark2']); document.body.classList.add('mono'); }
  // Android keeps the middle 66% of an adaptive icon: shrink the mark into it.
  if (layer === 'foreground' || layer === 'mono') document.getElementById('stage').style.transform = 'scale(0.72)';
</script>
</body>
</html>
