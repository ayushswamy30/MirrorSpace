<!doctype html>
<!--
  Lowkei's scenes — original airbrushed artwork, drawn in code so it is ours,
  reproducible (every scene has a seed) and renderable at any size.
  scripts/art/render-scenes.js opens this page as ?scene=<name>&w=&h=&seed=
  and screenshots the canvas.

  The look: soft shapes laid down like airbrush (canvas blur), light from the
  upper left, a limited palette per scene, and a fine grain over everything.
-->
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1000, SCENE = q.get('scene') || 'hills';
const c = document.getElementById('c'); c.width = W; c.height = H;
const ctx = c.getContext('2d');
const S = Math.min(W, H) / 1000;            // scale unit: 1000 = the short side

// Seeded randomness, so a scene is the same every render.
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(+q.get('seed') || 7);
const rand = (a, b) => a + (b - a) * R();

function vgrad(stops, y0 = 0, y1 = H) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function fillAll(style) { ctx.fillStyle = style; ctx.fillRect(0, 0, W, H); }
function soft(px, fn) { ctx.save(); ctx.filter = `blur(${px * S}px)`; fn(); ctx.restore(); }
function circle(x, y, r, col, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
function glow(x, y, r, inner, outer = 'rgba(255,255,255,0)', a = 1) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, inner); g.addColorStop(1, outer); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

/** A cumulus: a flat-bottomed body, a row of puffs, a crown on top, lit from the upper left. */
function cloud(x, y, s, base, light, shade) {
  const puffs = [];
  const n = 6 + Math.floor(R() * 3);
  for (let i = 0; i < n; i++) { const t = i / (n - 1); puffs.push([x + (t - 0.5) * s * 2.2, y - s * .15 - Math.sin(t * Math.PI) * s * .25, s * (.32 + Math.sin(t * Math.PI) * .22) * rand(.85, 1.1)]); }
  const crown = 2 + Math.floor(R() * 2);
  for (let i = 0; i < crown; i++) puffs.push([x + rand(-.45, .45) * s, y - s * rand(.55, .75), s * rand(.38, .5)]);
  const body = () => { ctx.beginPath(); ctx.ellipse(x, y, s * 1.2, s * .3, 0, 0, Math.PI * 2); ctx.fill(); };
  soft(12, () => { ctx.fillStyle = shade; ctx.globalAlpha = .9; ctx.save(); ctx.translate(s * .06, s * .12); body(); puffs.forEach(([px, py, r]) => { ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); }); ctx.restore(); ctx.globalAlpha = 1; });
  soft(6, () => { ctx.fillStyle = base; body(); puffs.forEach(([px, py, r]) => { ctx.beginPath(); ctx.arc(px, py - r * .05, r * .95, 0, Math.PI * 2); ctx.fill(); }); });
  soft(16, () => { puffs.forEach(([px, py, r]) => circle(px - r * .28, py - r * .32, r * .55, light, .95)); });
}

/** A rolling ridge, lit along its top edge. */
function hill(yBase, amp, top, bottom, rim, seed) {
  const r2 = rng(seed); const f = [r2() * 2 + 1.2, r2() * 3 + 2.5, r2() * 6 + 5], p = [r2() * 6, r2() * 6, r2() * 6];
  const y = x => yBase + amp * (Math.sin(x / W * f[0] * Math.PI + p[0]) * .6 + Math.sin(x / W * f[1] * Math.PI + p[1]) * .3 + Math.sin(x / W * f[2] * Math.PI + p[2]) * .1);
  const path = () => { ctx.beginPath(); ctx.moveTo(-20, H + 20); for (let x = -20; x <= W + 20; x += 8) ctx.lineTo(x, y(x)); ctx.lineTo(W + 20, H + 20); ctx.closePath(); };
  soft(1.5, () => { path(); ctx.fillStyle = vgrad([[0, top], [1, bottom]], yBase - amp, H); ctx.fill(); });
  soft(9, () => { ctx.strokeStyle = rim; ctx.globalAlpha = .55; ctx.lineWidth = 16 * S; ctx.beginPath(); for (let x = -20; x <= W + 20; x += 8) ctx.lineTo(x, y(x) + 8 * S); ctx.stroke(); ctx.globalAlpha = 1; });
  return y;
}

function sparkle(x, y, s, col = '#fff', a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = s * 1.2;
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x + s * .12, y - s * .12, x + s, y); ctx.quadraticCurveTo(x + s * .12, y + s * .12, x, y + s); ctx.quadraticCurveTo(x - s * .12, y + s * .12, x - s, y); ctx.quadraticCurveTo(x - s * .12, y - s * .12, x, y - s); ctx.fill(); ctx.restore();
}

function stars(n, big = 0) { for (let i = 0; i < n; i++) circle(R() * W, R() * H, rand(.4, 1.4) * S, '#fff', rand(.25, .9)); for (let i = 0; i < big; i++) sparkle(R() * W, R() * H * .9, rand(10, 22) * S, '#fff', rand(.7, 1)); }

function grain(amount = .09) {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * 255 * amount; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

function orb(x, y, r, deep, mid, light) {
  soft(r * .5 / S, () => circle(x, y, r * 1.25, light, .55));
  const g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, light); g.addColorStop(.7, mid); g.addColorStop(1, deep);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  soft(r * .08 / S, () => { ctx.globalAlpha = .85; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .45, r * .32, r * .17, -.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });
  soft(r * .12 / S, () => circle(x + r * .3, y + r * .35, r * .35, light, .35));
}

const SCENES = {
  // Mild days, easy feelings: green hills under a blue sky and pink clouds.
  hills() {
    fillAll(vgrad([[0, '#3567E0'], [.35, '#6FA2FA'], [.58, '#BFDcff'], [.6, '#CFE5FF']]));
    soft(60, () => glow(W * .5, H * .58, W * .5, 'rgba(255,190,210,.9)'));
    cloud(W * .22, H * .2, 120 * S, '#FFB3CB', '#FFE6EE', '#E58AAE');
    cloud(W * .72, H * .14, 90 * S, '#FFC0B0', '#FFEDE4', '#E89A96');
    cloud(W * .55, H * .36, 70 * S, '#FFB8D2', '#FFE9F1', '#DE8DB3');
    hill(H * .6, 40 * S, '#A7E3A2', '#6BBE78', '#EFFFD0', 3);
    hill(H * .68, 55 * S, '#8ED46A', '#4C9F45', '#E5FFB0', 11);
    hill(H * .78, 60 * S, '#73C653', '#2F8A37', '#D6FF9A', 19);
    const y = hill(H * .9, 50 * S, '#5FB947', '#1F6B2B', '#C9F58A', 29);
    for (let i = 0; i < 160; i++) { const x = R() * W, yy = y(x) + rand(10, H - y(x)) * S; circle(x, yy, rand(1.5, 4) * S, ['#FFFFFF', '#FFB3D1', '#FFE38A', '#FF8FA8'][i % 4], .9); }
    grain(.08);
  },
  // Overcast: a periwinkle sky full of soft pink and peach clouds.
  clouds() {
    fillAll(vgrad([[0, '#4C76E6'], [.55, '#9DB6FF'], [1, '#FFD7E6']]));
    soft(80, () => { glow(W * .8, H * .2, W * .4, 'rgba(255,214,235,.8)'); });
    const spots = [[.18, .78, 150], [.62, .7, 170], [.95, .82, 130], [.4, .45, 110], [.82, .4, 100], [.12, .32, 90], [.55, .18, 70], [.3, .9, 140]];
    spots.forEach(([x, y, s], i) => cloud(W * x, H * y, s * S, i % 2 ? '#FFC2A6' : '#FFA9C8', i % 2 ? '#FFEFE4' : '#FFE5EF', i % 2 ? '#E99A86' : '#D785AB'));
    grain(.08);
  },
  // Storms and the Mirror: a deep indigo night with a nebula and stars.
  nebula() {
    fillAll(vgrad([[0, '#07061A'], [1, '#141038']]));
    ctx.globalCompositeOperation = 'lighter';
    const hues = ['#C2398F', '#5B3BD6', '#2FA7C9', '#E07A4F', '#8E3BE0'];
    for (let i = 0; i < 26; i++) soft(rand(40, 90), () => circle(W * (.2 + .6 * R()), H * (.2 + .6 * R()), rand(80, 260) * S, hues[i % hues.length], rand(.12, .32)));
    for (let i = 0; i < 70; i++) { const a = rand(0, Math.PI * 2), d = rand(0, .38); soft(rand(14, 30), () => circle(W * (.55 + Math.cos(a) * d), H * (.48 + Math.sin(a) * d * .6), rand(30, 90) * S, hues[i % hues.length], rand(.08, .2))); }
    soft(30, () => glow(W * .55, H * .48, 160 * S, 'rgba(255,230,255,.55)'));
    ctx.globalCompositeOperation = 'source-over';
    stars(500, 7);
    grain(.06);
  },
  // Bright: a soft-focus bloom on periwinkle.
  bloom() {
    fillAll(vgrad([[0, '#8FA2FF'], [.6, '#C3B3FF'], [1, '#FFD6E8']]));
    for (let i = 0; i < 18; i++) soft(rand(10, 30), () => circle(R() * W, R() * H, rand(20, 90) * S, ['#FFFFFF', '#FFB3D1', '#FFE3C2'][i % 3], rand(.15, .35)));
    soft(14, () => { ctx.strokeStyle = 'rgba(160,110,200,.55)'; ctx.lineWidth = 10 * S; ctx.beginPath(); ctx.moveTo(W * .52, H * .55); ctx.quadraticCurveTo(W * .46, H * .8, W * .5, H * 1.05); ctx.stroke(); });
    const flower = (cx, cy, s, blur, warm) => soft(blur, () => {
      for (let k = 0; k < 2; k++) for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + k * .4, d = s * (k ? .28 : .48), px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d;
        const g = ctx.createRadialGradient(px - Math.cos(a) * s * .2, py - Math.sin(a) * s * .2, s * .02, px, py, s * (k ? .42 : .55));
        g.addColorStop(0, '#FFF8EE'); g.addColorStop(.5, k ? (warm ? '#FFD0A8' : '#FFC6E0') : (warm ? '#FFB38A' : '#FF9EC8')); g.addColorStop(1, warm ? '#FF8A6A' : '#F2729E');
        ctx.fillStyle = g; ctx.save(); ctx.translate(px, py); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(0, 0, s * (k ? .34 : .46), s * (k ? .2 : .26), 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      glow(cx, cy, s * .32, 'rgba(255,236,170,1)', 'rgba(255,200,120,0)');
    });
    flower(W * .2, H * .78, 170 * S, 16, true);
    flower(W * .82, H * .2, 120 * S, 20, false);
    flower(W * .55, H * .48, 260 * S, 3, false);
    grain(.08);
  },
  // Clear days: the sun coming up over a pastel sea.
  sunrise() {
    const sea = H * .62;
    fillAll(vgrad([[0, '#8FA2FF'], [.3, '#B9A2FF'], [.5, '#FF9EC8'], [.62, '#FFC08A']]));
    soft(70, () => glow(W * .5, sea, W * .45, 'rgba(255,236,170,.95)'));
    circle(W * .5, sea, 110 * S, '#FFF1B8');
    soft(20, () => circle(W * .5, sea, 140 * S, '#FFE38A', .5));
    ctx.fillStyle = vgrad([[0, '#B9A2FF'], [1, '#6F7FE8']], sea, H); ctx.fillRect(0, sea, W, H - sea);
    for (let i = 0; i < 60; i++) { const y = sea + Math.pow(i / 60, 1.6) * (H - sea), w = rand(.1, .5) * W * (1 - i / 80); soft(2, () => { ctx.globalAlpha = rand(.25, .6); ctx.fillStyle = ['#FFE3B0', '#FF9EC8', '#FFFFFF'][i % 3]; ctx.beginPath(); ctx.ellipse(W * .5 + rand(-.25, .25) * W * (i / 60), y, w * .5, (1.5 + i * .12) * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }); }
    grain(.07);
  },
  // Wound up: a burst of colour on the dark.
  burst() {
    fillAll(vgrad([[0, '#0B0A24'], [1, '#241A5A']]));
    const cx = W * .55, cy = H * .48;
    ctx.globalCompositeOperation = 'lighter';
    soft(50, () => glow(cx, cy, 420 * S, 'rgba(160,120,255,.8)'));
    const cols = ['#FF8FD0', '#7FD8FF', '#FFE38A', '#B9A2FF', '#FF9E7A'];
    for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2 + rand(-.1, .1), len = rand(260, 620) * S, wdt = rand(.02, .05); const g = ctx.createLinearGradient(cx, cy, cx + Math.cos(a) * len, cy + Math.sin(a) * len); g.addColorStop(0, '#fff'); g.addColorStop(.4, cols[i % 5]); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; soft(3, () => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a - wdt) * len, cy + Math.sin(a - wdt) * len); ctx.lineTo(cx + Math.cos(a + wdt) * len, cy + Math.sin(a + wdt) * len); ctx.closePath(); ctx.fill(); }); }
    soft(16, () => circle(cx, cy, 60 * S, '#ffffff'));
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 26; i++) sparkle(R() * W, R() * H, rand(6, 18) * S, cols[i % 5], .95);
    stars(220);
    grain(.06);
  },
  // Circle: glassy orbs drifting together.
  orbs() {
    fillAll(vgrad([[0, '#E4E0FF'], [.5, '#F6E2F4'], [1, '#FFE6D6']]));
    for (let i = 0; i < 8; i++) soft(60, () => circle(R() * W, R() * H, rand(150, 300) * S, ['#C3B3FF', '#FFC2DA', '#BDF0E2', '#FFD6B0'][i % 4], .5));
    orb(W * .3, H * .55, 170 * S, '#6C63E8', '#B7A6FF', '#E6DEFF');
    orb(W * .62, H * .38, 120 * S, '#E0559F', '#FF9EC8', '#FFE1EE');
    orb(W * .76, H * .72, 95 * S, '#2E9C86', '#86E3BC', '#DDFBEF');
    orb(W * .5, H * .78, 60 * S, '#E07A4F', '#FFC08A', '#FFEBD9');
    for (let i = 0; i < 9; i++) sparkle(R() * W, R() * H, rand(8, 16) * S, '#ffffff', .95);
    grain(.07);
  },
  // Fog: pale haze over lilac hills, a soft moon.
  haze() {
    fillAll(vgrad([[0, '#C9C3F2'], [.6, '#E7E1F7'], [1, '#F6E6EF']]));
    soft(30, () => circle(W * .7, H * .28, 80 * S, '#FFFFFF', .8));
    hill(H * .62, 35 * S, '#C8BFF0', '#AFA6E2', '#F2EEFF', 5);
    hill(H * .72, 45 * S, '#B9AFE8', '#9C92D6', '#EFEAFF', 13);
    hill(H * .84, 40 * S, '#A79DDE', '#867CC8', '#E9E4FF', 23);
    for (let i = 0; i < 10; i++) soft(40, () => { ctx.globalAlpha = rand(.3, .6); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(R() * W, H * rand(.5, .95), rand(200, 500) * S, rand(20, 50) * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });
    grain(.07);
  }
};

SCENES[SCENE]();
document.title = 'done';
</script>
</body>
</html>
