<!-- Supabase → Authentication → Emails → Templates. Paste as the message body.
     Lowkei signs people in with a six-digit code; {{ .Token }} is that code. -->
<div style="background:#F7F6FA;padding:40px 20px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#14131C">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border-radius:22px;padding:36px 32px;box-shadow:0 10px 40px rgba(143,162,255,0.25)">
    <p style="margin:0 0 24px;font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:0.16em">LOWKEI <span style="color:#9A5B1E">&#9679;</span></p>
    <h1 style="margin:0 0 12px;font:400 30px/1.15 Georgia,'Times New Roman',serif">Your Lowkei sign-in code</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#4F4E66">Here is the code that signs you in. Type it into the app.</p>
    <p style="margin:0 0 24px;padding:18px 0;border-radius:16px;background:linear-gradient(135deg,#E8ECFF,#FFE8F2,#FFF0E2);text-align:center;font:500 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;line-height:1.55;color:#4F4E66">It works once and expires within the hour. If you didn't ask for it, ignore this email — nothing happens without the code.</p>
  </div>
  <p style="max-width:440px;margin:18px auto 0;text-align:center;font-size:12px;color:#4F4E66">Lowkei only ever emails you sign-in codes.</p>
</div>
