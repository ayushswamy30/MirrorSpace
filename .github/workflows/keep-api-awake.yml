# Keeps the free Render API from falling asleep.
#
# Render's free tier sleeps a service after ~15 idle minutes, and waking it
# takes 20–60 seconds — long enough for a first open of the app to look
# broken. A light health check every 10 minutes keeps it awake. One always-on
# free service fits inside Render's 750 free hours a month.
#
# Free on a public repository. GitHub pauses scheduled workflows after 60
# days without any commit to the repo; re-enable it under Actions if so.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the health check
        run: curl --silent --show-error --max-time 90 --retry 2 https://mirrorspace-api.onrender.com/api/health
